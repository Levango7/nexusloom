name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  # 手动触发基线刷新：perf-baseline 因平台迁移/依赖变更/有意取舍的
  # 性能变化过期时，在 ubuntu 同源环境重立基线并提交回 main
  workflow_dispatch:
    inputs:
      refresh_baseline:
        description: '重立性能基线（跑 --update-baseline 并提交回 main）'
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    # 真 Postgres service（P1-B：状态后端可换的验收判据跑真 PG）。
    # 未装 psycopg 或 DSN 为空时 PG 判据 skip——SQLite 仍是默认路径。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LOOM_TEST_PG_URL: postgresql://postgres:loom@127.0.0.1:5432/loom_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 测试工具链钉版本：浮动安装会在上游发新版时随机打红 CI。
          # 实证教训（2026-08）：pytest>=8.0 漂到 9.1.1 + coverage 7.16.0 后，
          # Python 3.14 上 _sqlite3 C 模块段错误（exit 139），4 个版本矩阵全红。
          # 版本组合 = 本地全量验证过的组合（1423 passed / win + ubuntu）。
          # pymupdf：渲染层测试用它校验 pdf 文本层（中文保留率/代码缩进），
          # 只在测试期需要，不是运行时依赖。
          # psycopg：P1-B 真 PG 判据（state backend 可换）需要；
          # 运行时经 `nexusloom[postgres]` 可选装（见 pyproject extras）。
          # mypy 2.4.0：1.20.2 无法解析 numpy 2.5 stub 的 PEP 695 `type`（3.12+ 腿红）。
          pip install "pytest==8.3.4" "pytest-cov==7.1.0" "coverage==7.15.2" "pytest-asyncio==0.25.2" "ruff==0.16.4" "mypy==2.4.0" "types-PyYAML" "bandit>=1.7.0" "pip-audit>=2.7.0" "pymupdf>=1.24.0" "psycopg[binary]>=3.1.0"

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Syntax check (all modules)
        run: |
          python -m py_compile loom_core/*.py loom_doc/*.py docpipeline/*.py pipeline_core/*.py agents/*.py packs/docgen/agents/*.py run.py
          echo "SYNTAX OK"

      - name: Type check (mypy)
        run: |
          mypy loom_core/ loom_doc/ docpipeline/ pipeline_core/ agents/ packs/ --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          # bare --cov 采用 pyproject [tool.coverage.run] 的源码口径（loom_core/loom_doc/agents/run.py，
          # 不含 tests/），并由 [tool.coverage.report] fail_under=83 门禁：覆盖率跌破阈值即红。
          python -m pytest tests/ -v --tb=short --cov --cov-report=term-missing --cov-report=html

      - name: Security scan (bandit)
        run: |
          bandit -c pyproject.toml -ll -r loom_core loom_doc docpipeline pipeline_core agents packs -f json -o bandit-report.json

      - name: Dependency audit (pip-audit)
        run: |
          set +e
          # 只审计项目声明的依赖（requirements.txt），而非整个运行环境——
          # 后者会误报 CI runner 无关的全局包。
          # 2026-10-07 起：进程故障**不再记成功**。原先 audit 跑不起来（数据源
          # 抖动/超时）会被强制 rc=0，于是"没查"被当成"查了且干净"——安全门禁
          # 假绿比没有门禁更糟。现在重试一次，仍失败就红，让人去查为什么查不了。
          echo "=== auditing requirements.txt ==="
          python -m pip_audit -r requirements.txt --timeout 60 -f json -o /tmp/audit.json
          audit_rc=$?
          if [ $audit_rc -ne 0 ]; then
            echo "pip-audit 首次失败 (rc=$audit_rc)，重试一次…"
            sleep 10
            python -m pip_audit -r requirements.txt --timeout 60 -f json -o /tmp/audit.json
            audit_rc=$?
          fi
          if [ $audit_rc -ne 0 ]; then
            echo "::error::pip-audit 无法运行 (rc=$audit_rc)——依赖漏洞扫描处于「查不了」状态，不许当成「没有漏洞」"
            exit 1
          fi
          python -c "import json,sys;d=json.load(open('/tmp/audit.json',encoding='utf-8'));bad=[(x.get('name'),x.get('version'),[z.get('id') for z in x.get('vulns',[])]) for x in d.get('dependencies',[]) if x.get('vulns')];print('VULNS:',bad);sys.exit(1 if bad else 0)"
          exit $?

      - name: Pipeline smoke test (docgen)
        run: |
          set +e
          python run.py --check > /tmp/check_ci.txt 2>&1
          check_rc=$?
          set -e
          cat /tmp/check_ci.txt
          # --check 的退出码必须被采信。历史上它跑在 set +e 下且 rc 从不读取，
          # CI 只用 grep 卡住 selectolax 那一行——于是自检里除那一行以外的任何
          # 结构性故障（缺模块、目录不对、初始化炸了）都能一路绿。
          # 缺 LLM 凭据不再算结构性故障：bootstrap 已把它降为 warn，所以这里
          # 采信 rc 不会把 keyless 环境误判成红。
          if [ "$check_rc" -ne 0 ]; then
            echo "::error::启动自检失败（rc=$check_rc），见上方报告"
            exit 1
          fi
          # 正文提取必须落在 C 内核上。历史上 selectolax 1.0 让
          # selectolax.parser 在导入期报错，CI 静默退成正则启发式，
          # 而 --check 只探测顶层包所以照旧报 OK。
          if ! grep -q "HTML 解析后端: selectolax:" /tmp/check_ci.txt; then
            echo "::error::HTML 正文提取未使用 selectolax C 内核，已静默降级为正则启发式"
            exit 1
          fi
          # docgen 成文需要 LLM；常规 CI 作业没有模型 Secret。两种结果都可以接受，
          # 但必须是"诚实的那两种"：要么真写出成文（≥800 字节且非占位），
          # 要么被产出保真底线拦下并非零退出。历史上这里是 52 字节占位文档
          # 一路 exit 0、9 步全绿还落盘 docx/pdf。
          # 2026-10-06 起 keyless 走向是确定的：docgen 配的引擎 bocha/tavily/serper
          # 在 researcher 里没有实现分支，原先会静默退化成 mock 假摘要（出过一次
          # 351 字节占位稿、同 commit 重跑又绿），现在未知引擎只跳过不回落 mock
          # ⇒ 无检索结果 ⇒ 保真底线拦截（HARD_FLOOR + rc≠0），不再抽签。
          set +e
          python run.py test_input.md --pipeline docgen --output /tmp/out_ci.md > /tmp/docgen_ci.log 2>&1
          rc=$?
          set -e
          tail -25 /tmp/docgen_ci.log
          if [ "$rc" -ne 0 ]; then
            if grep -q "HARD_FLOOR" /tmp/docgen_ci.log; then
              # 这不是"通过"，而是"没凭据所以证明不了"。历史上这里写的是 SMOKE OK，
              # 于是 CI 绿灯被读成「docgen 能产出文档」，而它实际只证明了会被底线拦下。
              echo "::warning::docgen smoke SKIPPED：无 LLM 凭据，本轮未证明成文能力（仅证明保真底线会拦截）"
              echo "docgen smoke: **SKIPPED (keyless)** — 未证明成文能力，只证明保真底线拦截生效" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::docgen 失败，且不是保真底线拦截（exit=$rc）"
              exit 1
            fi
          else
            if [ ! -f /tmp/out_ci.md ]; then
              echo "::error::docgen exit 0 却没有写出交付物 /tmp/out_ci.md"
              exit 1
            fi
            size=$(wc -c < /tmp/out_ci.md)
            if [ "$size" -lt 800 ]; then
              echo "::error::产出仅 $size 字节，疑似空/占位文档（门禁下限 800）"
              sed -n '1,20p' /tmp/out_ci.md
              exit 1
            fi
            if grep -q "未采集到可整合的搜索结果" /tmp/out_ci.md; then
              echo "::error::产出是占位文档（命中“未采集到可整合的搜索结果”）"
              exit 1
            fi
            # CI 自己再查一遍抓取层原始素材签名，不复用 quality_gate 的判定。
            # 那份 21,926 字节的文档当初就是以 OUTPUT FIDELITY OK 的名义从这里溜过去的
            # ——当时 gate 和这里都只查"非空 + 非已知占位语"。gate 已修，但这道重复是有意的：
            # 判据若哪天单方面失效，宁可让 CI 红，也不要它继续替产出背书。
            # 签名与 loom_doc/degradation.py 的 FETCH_TIMESTAMP_RE 同源。
            if grep -qE '^下载时间: [0-9]{4}-[0-9]{2}-[0-9]{2}' /tmp/out_ci.md; then
              echo "::error::产出夹带抓取层原始素材（命中 fetcher 落盘格式的下载时间行）"
              exit 1
            fi
            echo "OUTPUT FIDELITY OK ($size bytes)"
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build validation
        run: |
          docker build -t doc-pipeline:ci .
          echo "DOCKER BUILD OK"

  perf-regression:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install numpy selectolax

      - name: Restore perf baseline
        uses: actions/cache/restore@v4
        with:
          path: |
            benchmark_results.json
            benchmark_history.jsonl          # 基线与历史分开缓存：前者只在成功时滚动，后者每轮都追加。
          # 两个 path 用同一次 restore 拿，键不同 → 见下面的两步 save/restore。
          # 精确键优先；带 run_id 的键只在 save 后的下次运行可命中，
          # 此后回退 perf-baseline-（时间最新优先）。
          # 注意：restore 会覆盖仓库文件；历史失败 run 曾经 always() 保存
          # 污染基线（已修：save 改 success()），污染缓存已手动删除。
          #
          # 历史文件与基线同进同出：跨 run 波动带（benchmark.py 的
          # _historical_spreads）要靠它判断"这台 runner 今天整体慢 40%"还是
          # "代码真的慢了"。只缓存 baseline 的话，波动带永远拿不到样本，
          # 等于门禁在 CI 里退化成单样本相对阈——正是原来一直红的那个病根。
          key: perf-baseline-main-not-exact-${{ github.run_id }}
          restore-keys: |
            perf-baseline-main-

      - name: Restore perf history
        uses: actions/cache/restore@v4
        with:
          path: benchmark_history.jsonl
          # 与基线分开的另一把键：历史每轮都追加（含红跑），基线只在成功时滚动。
          # 同一把键做不到这两件事——见下面两步 save 的 if 条件。
          key: perf-history-main-not-exact-${{ github.run_id }}
          restore-keys: |
            perf-history-main-

      - name: Performance regression check
        run: |
          python benchmark.py --ci --threshold 0.30
          echo "PERF CHECK PASSED"

      # 仅 main 且 perf 通过时更新滚动基线。原 `if: always()` 会把失败
      # run 的劣化结果存成新基线（benchmark.py 对比失败时不会重写文件，
      # 但 b38cba9 时期文件曾被污染），后续 run 对着错误基准比 → 永远误报
      - name: Save perf baseline
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: benchmark_results.json
          key: perf-baseline-main-${{ github.run_id }}

      # 历史 JSONL 是"测量日志"而不是"基准"：红跑的那轮同样要留下样本，
      # 否则跨 run 波动带永远只在绿跑上累积，一次环境劣化就把门禁锁死在红色。
      # 基线仍按 success() 才滚动更新（避免把劣化结果洗成新的正常值）。
      - name: Save perf history
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: benchmark_history.jsonl
          key: perf-history-main-${{ github.run_id }}

  refresh-baseline:
    # 手动触发的基线刷新：与 perf 判定同源环境（ubuntu + Python 3.12 +
    # 同款依赖）跑 --update-baseline，提交回 main。适用于：平台迁移、
    # 依赖升级、或经评审接受的有意性能变化（如 SSE 事件驱动的
    # +2.5μs/event 换 200ms→亚毫秒推送延迟）之后的基线校准。
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_baseline
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install numpy selectolax

      - name: Run benchmarks (update baseline)
        run: |
          # 跑 3 轮取稳定值（--quick 与 CI 同参；--update-baseline 直接写文件）
          python benchmark.py --update-baseline

      - name: Commit new baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # benchmark_results.json 在 .gitignore（运行产物），本 job 的目的
          # 就是人工留存跨 run 稳定基线，故 -f 强制入库
          git add -f benchmark_results.json
          git commit -m "chore(bench): 重立性能基线（ubuntu/3.12，workflow_dispatch）" || echo "no change"
          git push

      # 旧键 cache 无法删除（无 Evict API 权限），因此这里主动写入新键：
      # restore 会优先命中精确键，其次按 restore-keys 取时间最新的键。
      #
      # 这一步是必需的，不能只 echo：perf-regression 的 save 条件是
      # `event_name == 'push'`，而本 job 由 workflow_dispatch 触发，
      # 不主动保存的话刷新出的基线永远进不了缓存，perf job 会一直拿
      # 几个月前的旧键比对 → 永久误报回归。
      - name: Publish refreshed baseline to cache
        uses: actions/cache/save@v4
        with:
          path: |
            benchmark_results.json
            benchmark_history.jsonl
          key: perf-baseline-main-${{ github.run_id }}
