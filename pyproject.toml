[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusloom"
version = "3.12.0"
description = "Loom (nexusloom) - a self-hosted agent workflow runtime for verifiable delivery: declarative YAML DAGs, output contracts, reproducible locks, approval gates and an auditable delivery ledger"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28.0",
    "selectolax>=0.3.0",       # 经 artesian.selectolax_compat 使用（artesian 未发布前在此显式声明）
    "aiohttp>=3.8.0",          # fetcher 异步 I/O 路径（同步回退需 requests）
    "orjson>=3.0",             # 经 artesian.fast_json 使用（C 实现 3-10x 加速）；同上
    "duckduckgo-search>=4.0.0", # researcher 默认注册的 DuckDuckGo 引擎
]

[project.optional-dependencies]
async = ["aiohttp>=3.8.0"]
search = ["duckduckgo-search>=4.0.0"]
benchmark = ["numpy>=1.24.0"]
postgres = ["psycopg[binary]>=3.1.0"]  # 状态后端可换（spec §5.4）：TaskQueue 指向 PG DSN 时装
# 能力包：装了才有，没装则对应节点如实回报跳过原因（不是静默降级）。
# 此前这些依赖只出现在 requirements.txt/Dockerfile 里，`pyproject.toml` 完全没有，
# 于是 `pip install .` 与 `pip install -r requirements.txt` 会装出能力不同的两份东西。
# 版本下限取自本机实测可用版本（本机 python-docx 1.2.0 / reportlab 5.0.0 /
# PyMuPDF 1.27.2.3 / openpyxl 3.1.5 / python-pptx 1.0.2 / paddleocr 3.7.0 + paddlex 3.7.2），不是猜的。
render = [                      # loom_doc/renderer.py：Markdown → docx / pdf / xlsx / pptx
    "python-docx>=1.2.0",
    "reportlab>=5.0.0",
    "openpyxl>=3.1.0",          # xlsx 结构化子集：表格 → 工作表
    "python-pptx>=1.0.0",       # pptx 结构化子集：标题 → 幻灯片，表格落真表
]
ingest = ["pymupdf>=1.24.0"]    # loom_doc/ingest.py：PDF 按字号推断标题层级
ocr = [                         # loom_doc/ingest.py：扫描件/图片 PP-StructureV3 路线
    "paddleocr>=3.0",           # PPStructureV3 是 3.x 的 API，2.x 装了也没有这个符号
    "paddlex[ocr]>=3.0",        # 实测本机只装 paddleocr 时 PPStructureV3 实例化即抛错
]
embed = ["sentence-transformers>=2.2.0"]   # artesian.embeddings 的 local 语义后端（实现已迁出本仓）
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]
# 打包了本机跑得动的全部轻能力。ocr / embed 有意不进：它们分别拉起 PaddleX 与
# torch（GB 级），需要时显式装 `.[ocr]` / `.[embed]`。
all = [
    "aiohttp>=3.8.0",
    "duckduckgo-search>=4.0.0",
    "python-docx>=1.2.0",
    "reportlab>=5.0.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "pymupdf>=1.24.0",
]

[project.scripts]
loom = "run:main"
doc-pipeline = "run:main"      # 旧入口别名，过渡期保留

[tool.setuptools]
packages = [
    "loom_core", "loom_doc", "agents", "scripts", "artesian",
    "packs", "packs.docgen", "packs.docgen.agents",
    # 兼容 shim（spec §7.1 命名收官）：旧名以转发别名保留，
    # 装进 wheel 才能让旧 import 在安装态也成立（MAOP 等既有消费者零改动）。
    # pipeline_core/__init__.py 同时是 MAOP 探根的对外契约文件。
    "docpipeline", "pipeline_core",
]
py-modules = ["run"]

# 流水线 YAML / lock / quality profile / prompt 模板必须随 wheel 走。
# 此前 packages 只列了 Python 包，pipelines/*.yaml 与 quality/、prompts/
# 不在任何 Python 包里 —— `pip install .` 装出一个没有流水线的引擎，
# 恰是 product-spec §3 P0 判据 1 要求消灭的形态（装完 --check 一片红）。
# scripts/checker_rules.yaml 同理：它是 scripts 包旁边的数据文件，没声明
# 时 markdown_checker 在安装态下找不到默认规则集。
[tool.setuptools.package-data]
scripts = ["checker_rules.yaml"]
artesian = ["py.typed"]
loom_core = ["dashboard/*"]
"packs.docgen" = [
    "pipelines/*.yaml",
    "pipelines/*.lock",
    "pipelines/_quality-tail.yaml",
    "pipelines/_quality-tail.lock",
    "quality/*.yaml",
    "prompts/*.yaml",
    "pack.yaml",
]

[tool.setuptools.data-files]
# 装到 <prefix>/pipelines。解析顺序见 loom_core.paths：
# 源码树（仓库根/pipelines）优先，其次安装态这一份，env 可覆盖。
# 只承载核心散装流水线；docgen pack 的 YAML/quality/prompts 随
# `packs.docgen` package-data 走（见上）。2026-10-11 pack-docgen 拆出后
# quality/、prompts/ 已不在 pipelines/ 下，原有两个子目录键删除——
# 死键的 glob 零命中是静默的（setuptools 对空 glob 不报错），
# 靠 test_release_readiness 的零命中判据兜底。
pipelines = [
    "pipelines/*.yaml",
    "pipelines/*.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not e2e'"
markers = [
    "e2e: 真实端到端测试（调用真实 LLM + 搜索引擎，需 .env 配置，CI 默认跳过）",
    "slow: 慢测试（超时 >60s，默认运行但可用 -m 'not slow' 跳过）",
]

[tool.coverage.run]
# 覆盖率只计产品源码：tests/scripts/benchmark 不入门禁
# （--cov=. 会把 tests/ 自身的近 100% 计入，虚高到 ~79%，无门禁价值）
relative_files = true
include = ["loom_core/*", "loom_doc/*", "agents/*", "packs/*", "run.py"]
omit = ["tests/*", "scripts/*", "benchmark.py"]

[tool.coverage.report]
# 门禁 = 2026-08-28 实测基线 85.80%（源码口径、排除 e2e，补测后）- 2，防覆盖率无声滑坡
fail_under = 83
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
implicit_optional = true
disable_error_code = ["valid-type", "attr-defined"]

[[tool.mypy.overrides]]
# 已安装但无类型标注（py.typed 缺失）的第三方包：--ignore-missing-imports 不覆盖 import-untyped
module = ["yaml"]
ignore_missing_imports = true

[tool.bandit]
# B310（urllib.urlopen）在本仓 scope 内实测 3 处：llm_router 1 + writer 2。
# 三处的目标 URL 都是**运维配置**决定的（`llm_router` 从 env 取 `*_API_URL`、
# writer 取 config 的 `llm_api_url`），不受请求方/搜索结果等外部输入控制，
# 所以这里不阻断；反过来也别把它改成 SSRF 阻断——指向内网的本地推理端点
# （如 http://127.0.0.1:11434）是有意支持的配置场景。真正吃外部 URL 的两条路
# 各自有闸：webhook 走 event_hook 的 artesian.url_guard，抓页面走 fetcher。
# 数字口径要回来改：这条注释原写"11 处"，而迁出前（e4c02b4）实测只有 10 处
# （search_engines 7 + writer 2 + llm_router 1）——数字本身早就漂了一次；
# 其中 7 处随 search_engines 迁至 artesian，那边另立了 bandit 门禁（含 LOW 级棘轮），
# 不是没人扫了。
skips = ["B310"]
