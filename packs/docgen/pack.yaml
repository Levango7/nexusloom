# pack-docgen —— 文档生成领域件包（spec §5.2 pack 机制 v1）
#
# 引擎不 import 本包；本包经 loom_core.pack_manifest 被发现与装配：
#   - agents/     由 AgentLoader 多目录发现（与 agents/ 内置件同路径注册）
#   - pipelines/  由 installed_pipelines / 流水线解析union进候选
#   - quality/    由 quality_gate.load_profile 按名解析
#   - prompts/    由 writer 按 profile 名解析
# 拆出判据（spec §5.2 验收）：--check 不要求本包任何文件；删掉本包，
# 引擎与其余 13 条流水线照常工作（文档件全部来自本包的 import 面已清零）。
name: docgen
version: "1.0.0"
description: 文档生成领域件 —— writer/quality_gate/checker/layout/fact_checker + docgen 系流水线 + demo 离线体验流水线 + 质量档案 + prompt 模板
agents:
  - writer
  - quality_gate
  - checker
  - layout
  - fact_checker
pipelines:
  - docgen
  - docgen-render
  - docgen-verified
  - docgen-lean
  - docreq
  - kb-docgen
  - demo
quality_profiles:
  - technical-doc
  - tutorial
